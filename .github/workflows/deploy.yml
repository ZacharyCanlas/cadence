# The app is now built by Vite, so GitHub Pages serves the dist/ artifact from
# this workflow rather than the repository itself. The configure-pages step
# switches the Pages source to Actions if it is not already set, so a fresh
# clone of this repository deploys without anyone visiting the settings page.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      # Pinned through .nvmrc so the runner's npm matches the one that wrote
      # package-lock.json. `npm ci` refuses a lock file whose peer-dependency
      # resolution differs from its own, which a floating major will drift into.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
